<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>zelfscanner — story editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }
      #layout {
        display: flex;
        height: 100%;
      }

      #scenes {
        width: 220px;
        background: #1c1c1c;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      #scenes h1 {
        font-size: 13px;
        margin: 0 0 10px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #scene-list {
        flex: 1;
        overflow-y: auto;
      }
      .scene-item {
        padding: 8px 10px;
        margin-bottom: 4px;
        background: #262626;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .scene-item:hover {
        background: #2e2e2e;
      }
      .scene-item.active {
        background: #2a6;
        color: #fff;
      }
      .scene-item .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .scene-item .order-btns {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }
      .scene-item button {
        background: transparent;
        border: 0;
        color: inherit;
        opacity: 0.6;
        cursor: pointer;
        font-size: 12px;
        padding: 2px 4px;
      }
      .scene-item button:hover {
        opacity: 1;
      }
      .scene-item.fixed {
        border-left: 3px solid #ffff5c;
      }
      .scene-item.fixed + .scene-item:not(.fixed),
      .scene-item.fixed.last {
        margin-top: 10px;
      }
      .scene-item .tag {
        font-size: 10px;
        opacity: 0.6;
        flex-shrink: 0;
        margin-left: auto;
      }
      .scene-item .tag.warn {
        color: #fc6;
        opacity: 1;
      }
      .scene-item.active .tag.warn {
        color: #fff;
      }
      #form .intro {
        font-size: 11px;
        color: #888;
        line-height: 1.4;
        margin: -4px 0 4px;
      }
      #form input[type='color'] {
        width: 44px;
        height: 31px;
        padding: 2px;
        flex-shrink: 0;
        cursor: pointer;
      }
      #add-scene {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        background: #2a6;
        color: #fff;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      #add-scene:active {
        background: #194;
      }

      #form {
        width: 340px;
        background: #181818;
        padding: 16px;
        overflow-y: auto;
        border-left: 1px solid #2a2a2a;
        border-right: 1px solid #2a2a2a;
      }
      #form h1 {
        font-size: 13px;
        margin: 0 0 12px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #form label {
        display: block;
        font-size: 11px;
        color: #999;
        margin: 12px 0 4px;
      }
      #form input,
      #form select,
      #form textarea {
        width: 100%;
        padding: 7px 8px;
        font-size: 13px;
        background: #000;
        color: #7cfc00;
        border: 1px solid #444;
        border-radius: 3px;
        font-family: 'SF Mono', Menlo, monospace;
      }
      #form textarea {
        min-height: 60px;
        resize: vertical;
        font-family: sans-serif;
        color: #eee;
      }
      #form select {
        color: #eee;
      }
      #form .row {
        display: flex;
        gap: 6px;
      }
      #form .row input:not([type='color']) {
        flex: 1;
      }
      #form input.plain {
        font-family: sans-serif;
        color: #eee;
      }
      #form .small-btn {
        padding: 4px 12px;
        font-size: 11px;
        background: #444;
        color: #eee;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      #form .small-btn:hover {
        background: #555;
      }
      #form .part {
        margin-top: 18px;
        padding: 10px 12px 12px;
        border: 1px solid #2e2e2e;
        border-radius: 4px;
      }
      #form .part.previewing {
        border-color: #2a6;
      }
      #form .part.previewing .small-btn {
        background: #2a6;
        color: #fff;
      }
      #form .part-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #form .part-head h2 {
        font-size: 12px;
        margin: 0;
        color: #ddd;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #form .radio-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
      }
      #form .radio-row label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        font-size: 12px;
        color: #ccc;
        cursor: pointer;
      }
      #form .radio-row input {
        width: auto;
        margin: 0;
      }
      #form .hint {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
        line-height: 1.4;
      }
      .upload-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .upload-row input[type='file'] {
        flex: 1;
        font-size: 11px;
        color: #aaa;
        border: 0;
        padding: 0;
        background: transparent;
      }
      .upload-status {
        font-size: 11px;
        color: #999;
      }
      .upload-status.ok {
        color: #7cfc00;
      }
      .upload-status.err {
        color: #f77;
      }
      #delete-scene {
        width: 100%;
        padding: 8px;
        margin-top: 20px;
        background: #622;
        color: #fca;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      #delete-scene:hover {
        background: #733;
      }
      #empty-state {
        color: #666;
        font-size: 13px;
        padding: 40px 0;
        text-align: center;
      }

      #right {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #topbar {
        background: #1c1c1c;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #2a2a2a;
      }
      #topbar label {
        font-size: 11px;
        color: #999;
      }
      #version {
        width: 90px;
        padding: 5px 7px;
        font-size: 12px;
        background: #000;
        color: #7cfc00;
        border: 1px solid #444;
        border-radius: 3px;
        font-family: monospace;
      }
      #save {
        padding: 8px 18px;
        background: #2a6;
        color: #fff;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      #save:active {
        background: #194;
      }
      #barcodes,
      #library {
        padding: 8px 14px;
        background: #444;
        color: #eee;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      #barcodes:hover,
      #library:hover {
        background: #555;
      }
      #status {
        font-size: 12px;
        flex: 1;
      }
      #status.ok {
        color: #7cfc00;
      }
      #status.err {
        color: #f77;
      }
      #errors {
        padding: 8px 16px;
        background: #3a1414;
        color: #fca;
        font-size: 12px;
        white-space: pre-wrap;
        display: none;
      }
      #errors.show {
        display: block;
      }

      #deploybar {
        background: #1c1c1c;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #2a2a2a;
        font-size: 12px;
      }
      #deploybar label {
        font-size: 11px;
        color: #999;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      #deploybar label input[type='checkbox'] {
        width: auto;
      }
      #device-summary {
        color: #999;
        flex: 1;
      }
      #deploybar button {
        padding: 7px 14px;
        font-size: 12px;
        background: #444;
        color: #eee;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      #deploybar button:hover {
        background: #555;
      }
      #deploy {
        background: #268;
      }
      #deploy:hover {
        background: #379;
      }
      #deploy:disabled,
      #refresh-devices:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #deploy-log {
        margin: 0;
        padding: 8px 16px;
        background: #0c0c0c;
        color: #7cfc00;
        font-size: 11px;
        font-family: monospace;
        white-space: pre-wrap;
        display: none;
        max-height: 160px;
        overflow-y: auto;
      }
      #deploy-log.show {
        display: block;
      }

      #frame-wrap {
        flex: 1;
        background: #000;
        position: relative;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      #simbar {
        background: #1c1c1c;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 1px solid #2a2a2a;
      }
      #simbar label {
        font-size: 11px;
        color: #999;
      }
      #simbar input {
        width: 160px;
        padding: 6px 8px;
        font-size: 13px;
        background: #000;
        color: #7cfc00;
        border: 1px solid #444;
        border-radius: 3px;
        font-family: monospace;
      }
      #simbar button {
        padding: 7px 14px;
        font-size: 12px;
        background: #444;
        color: #eee;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      #simbar button:hover {
        background: #555;
      }
      #simbar #dock.on {
        background: #2a6;
        color: #fff;
      }
      #simlog {
        font-size: 11px;
        color: #7cfc00;
        font-family: monospace;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="scenes">
        <h1>Story</h1>
        <div id="scene-list"></div>
      </div>

      <div id="form"></div>

      <div id="right">
        <div id="topbar">
          <label for="version">versie</label>
          <input id="version" type="text" value="0.1.0" />
          <div id="status"></div>
          <button id="library" type="button">Bestanden</button>
          <button id="barcodes" type="button">Barcodes (PDF)</button>
          <button id="save">Opslaan</button>
        </div>
        <div id="deploybar">
          <button id="refresh-devices">Ververs devices</button>
          <div id="device-summary">devices nog niet opgehaald</div>
          <label><input type="checkbox" id="restart-app" /> herstart app na push</label>
          <button id="deploy">Push naar scanners</button>
        </div>
        <pre id="deploy-log"></pre>
        <div id="errors"></div>
        <div id="frame-wrap">
          <iframe id="pack-frame" src="../pack/index.html"></iframe>
        </div>
        <div id="simbar">
          <label for="code">test-scan</label>
          <input
            id="code"
            type="text"
            placeholder="bv. 8712345678901"
            autocomplete="off" />
          <button id="scan">Scan</button>
          <button id="dock" title="scanner in of uit de cradle, zoals op het device">In cradle</button>
          <button id="reload">Herlaad preview</button>
          <div id="simlog"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // Vorm: zie tools/manifest-schema.js.
        function emptyManifest() {
          return {
            version: '0.3.0',
            resetScan: null,
            splash: {},
            instruction: {},
            intro: {},
            audiotour: {},
            stops: [],
            end: {},
          };
        }
        var manifest = emptyManifest();
        var loaded = false;
        var assets = {video: [], audio: [], image: []};
        // Vaste onderdelen van de lijst; stops hebben index 0 en hoger.
        var SPLASH = -1;
        var INSTRUCTION = -2;
        var AUDIOTOUR = -3;
        var END = -4;
        var INTRO = -5;
        // zelfde defaults als pack/runtime.js en pack/end.js
        var DEFAULT_INSTRUCTION_TEXT = 'Keep the scanner next to your ear';
        var DEFAULT_INSTRUCTION_SECONDS = 5;
        var DEFAULT_END_TEXT = 'Please gather at the self-checkout';
        var DEFAULT_COLOR = '#ffff5c';
        var HINT_TYPES = [
          ['image', 'Afbeelding'],
          ['puzzle', 'Puzzel'],
          ['video', 'Video'],
        ];
        var REWARD_TYPES = [
          ['audio', 'Audiotour'],
          ['video', 'Video'],
        ];
        var KIND = {image: 'image', puzzle: 'image', video: 'video', audio: 'audio'};
        var SHORT = {image: 'afb', puzzle: 'puzzel', video: 'video', audio: 'audio'};
        var activeIndex = SPLASH;
        // Bij een stop: laat de preview de hint of de beloning zien.
        var previewPart = 'hint';

        var sceneListEl = document.getElementById('scene-list');
        var formEl = document.getElementById('form');
        var versionEl = document.getElementById('version');
        var statusEl = document.getElementById('status');
        var errorsEl = document.getElementById('errors');
        var frame = document.getElementById('pack-frame');
        var simlog = document.getElementById('simlog');

        function setStatus(msg, isErr) {
          statusEl.textContent = msg;
          statusEl.className = isErr ? 'err' : 'ok';
        }

        function log(msg) {
          simlog.textContent = new Date().toLocaleTimeString() + '  ' + msg;
        }

        function reloadFrame() {
          frame.src = '../pack/index.html?_=' + Date.now();
        }

        function copy(obj) {
          // de preview mag de objecten van de editor niet delen
          return JSON.parse(JSON.stringify(obj));
        }

        function previewTarget() {
          if (activeIndex === SPLASH) return {kind: 'splash'};
          if (activeIndex === INSTRUCTION) return {kind: 'instruction'};
          if (activeIndex === INTRO) return {kind: 'intro'};
          if (activeIndex === AUDIOTOUR) return {kind: 'audiotour'};
          if (activeIndex === END) return {kind: 'end'};
          return {kind: previewPart, index: activeIndex};
        }

        // Zet de live preview op het geselecteerde onderdeel, met wat er nu
        // in de editor staat (ook als het nog niet is opgeslagen). Via
        // window.__editorPreview in pack/runtime.js.
        function syncPreview() {
          var win = frame.contentWindow;
          if (!loaded || !win || typeof win.__editorPreview !== 'function') return;
          win.__editorPreview(copy(manifest), previewTarget());
        }

        // Alleen het manifest in de preview bijwerken, niet verspringen: voor
        // wijzigingen die niets in beeld veranderen (naam, barcode), zodat
        // de test-scan de nieuwe code kent zonder dat de puzzel opnieuw begint.
        function pushManifest() {
          var win = frame.contentWindow;
          if (!loaded || !win || typeof win.__editorPreview !== 'function') return;
          win.__editorPreview(copy(manifest), null);
        }
        // Een herladen preview weet niet dat de scanner in de cradle staat.
        frame.addEventListener('load', function () {
          if (inCradle) sendDock();
          syncPreview();
        });

        // Willekeurige 13-cijferige code die nog nergens in de story gebruikt
        // wordt (geen product-barcode, niet de reset-code), behalve door `self`.
        function randomBarcode(self) {
          var used = {};
          manifest.stops.forEach(function (s) {
            if (s !== self && s.scan) used[s.scan] = true;
          });
          if (self !== SPLASH && manifest.resetScan) used[manifest.resetScan] = true;
          var code;
          do {
            code = '';
            for (var i = 0; i < 13; i++) code += Math.floor(Math.random() * 10);
          } while (used[code]);
          return code;
        }

        function isIncomplete(stop) {
          return !stop.scan || !(stop.hint && stop.hint.src) || !(stop.reward && stop.reward.src);
        }

        // ---- data loading ----

        function loadManifest() {
          return fetch('/api/manifest')
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              var notes = [];
              manifest = emptyManifest();
              if (data && typeof data === 'object' && !data.error) {
                Object.keys(data).forEach(function (k) {
                  manifest[k] = data[k];
                });
              }
              ['splash', 'instruction', 'intro', 'audiotour', 'end'].forEach(function (k) {
                if (!manifest[k] || typeof manifest[k] !== 'object') manifest[k] = {};
              });
              if (!Array.isArray(manifest.stops)) manifest.stops = [];
              // Oud formaat (losse scenes): niet om te zetten, de betekenis is
              // anders. Splash, instructie en reset blijven wel staan.
              if (manifest.scenes) {
                notes.push(
                  manifest.scenes.length + ' scene(s) uit het oude formaat niet overgenomen — bouw de stops opnieuw op',
                );
                delete manifest.scenes;
              }
              // Oudere packs hebben nog geen reset-code: meteen eentje
              // voorstellen, opslaan zonder kan niet.
              if (!manifest.resetScan) {
                manifest.resetScan = randomBarcode(SPLASH);
                notes.push('nieuwe reset-barcode ' + manifest.resetScan + ' voorgesteld');
              }
              if (notes.length) setStatus(notes.join(', ') + ' — nog niet opgeslagen');
              loaded = true;
              activeIndex = SPLASH;
              versionEl.value = manifest.version || '0.3.0';
              renderAll();
              syncPreview();
            })
            .catch(function (e) {
              setStatus('manifest laden mislukt: ' + e.message, true);
            });
        }

        function loadAssets() {
          return fetch('/api/assets')
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              assets = data;
            })
            .catch(function () {
              /* dropdowns just show free-text fallback */
            });
        }

        // ---- rendering: list ----

        function select(index) {
          if (index !== activeIndex) previewPart = 'hint';
          activeIndex = index;
          renderAll();
          syncPreview();
        }

        function listItem(label, tag, index, opts) {
          opts = opts || {};
          var item = document.createElement('div');
          item.className =
            'scene-item' +
            (opts.fixed ? ' fixed' : '') +
            (opts.last ? ' last' : '') +
            (activeIndex === index ? ' active' : '');
          var name = document.createElement('span');
          name.className = 'name';
          name.textContent = label;
          item.appendChild(name);
          if (tag) {
            var t = document.createElement('span');
            t.className = 'tag' + (opts.warn ? ' warn' : '');
            t.textContent = tag;
            item.appendChild(t);
          }
          item.onclick = function () {
            select(index);
          };
          sceneListEl.appendChild(item);
          return item;
        }

        function renderSceneList() {
          sceneListEl.innerHTML = '';
          listItem('Splash', 'altijd eerst', SPLASH, {fixed: true});
          listItem('Luisterinstructie', 'start + vóór audio', INSTRUCTION, {fixed: true});
          listItem('Intro-audio', manifest.intro.src ? 'vóór stop 1' : 'geen', INTRO, {fixed: true});
          listItem('Audiotour-scherm', 'alle audio', AUDIOTOUR, {fixed: true});

          manifest.stops.forEach(function (stop, i) {
            var incomplete = isIncomplete(stop);
            var tag = incomplete
              ? 'onvolledig'
              : SHORT[stop.hint.type] + ' → ' + SHORT[stop.reward.type];
            var item = listItem(
              i + 1 + '. ' + (stop.id || '(zonder naam)'),
              tag,
              i,
              {warn: incomplete},
            );

            var btns = document.createElement('span');
            btns.className = 'order-btns';
            [
              ['↑', 'naar boven', -1],
              ['↓', 'naar beneden', 1],
            ].forEach(function (b) {
              var btn = document.createElement('button');
              btn.textContent = b[0];
              btn.title = b[1];
              btn.onclick = function (e) {
                e.stopPropagation();
                moveStop(i, b[2]);
              };
              btns.appendChild(btn);
            });
            item.appendChild(btns);
          });

          var add = document.createElement('button');
          add.id = 'add-scene';
          add.textContent = '+ stop toevoegen';
          add.onclick = addStop;
          sceneListEl.appendChild(add);

          listItem('Eindscherm', 'na laatste stop', END, {fixed: true, last: true});
        }

        function moveStop(i, dir) {
          var j = i + dir;
          if (j < 0 || j >= manifest.stops.length) return;
          var tmp = manifest.stops[i];
          manifest.stops[i] = manifest.stops[j];
          manifest.stops[j] = tmp;
          if (activeIndex === i) activeIndex = j;
          else if (activeIndex === j) activeIndex = i;
          renderAll();
          syncPreview();
        }

        function addStop() {
          var n = manifest.stops.length + 1;
          var ids = {};
          manifest.stops.forEach(function (s) {
            ids[s.id] = true;
          });
          while (ids['stop' + n]) n++;
          var stop = {id: 'stop' + n, scan: null, hint: {type: 'image'}, reward: {type: 'audio'}};
          stop.scan = randomBarcode(stop);
          manifest.stops.push(stop);
          select(manifest.stops.length - 1);
        }

        // ---- rendering: form helpers ----

        // Real <select> instead of a text-input+datalist: always shows
        // exactly what's on disk right now (datalist suggestions were easy
        // to miss / inconsistent across browsers). Keeps the current value
        // as an extra option even if it's not in the list, so switching
        // stops never silently blanks an existing reference.
        function assetPicker(kind, currentValue, onChange) {
          var sel = document.createElement('select');
          var blank = document.createElement('option');
          blank.value = '';
          blank.textContent = '— kies bestand —';
          sel.appendChild(blank);

          var list = assets[kind] || [];
          var seen = {};
          list.forEach(function (v) {
            seen[v] = true;
            var opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            sel.appendChild(opt);
          });
          if (currentValue && !seen[currentValue]) {
            var missing = document.createElement('option');
            missing.value = currentValue;
            missing.textContent = currentValue + ' (niet gevonden op disk)';
            sel.appendChild(missing);
          }
          sel.value = currentValue || '';
          sel.onchange = function () {
            onChange(sel.value || undefined);
          };
          return sel;
        }

        function uploadRow(kind, onUploaded) {
          var wrap = document.createElement('div');
          wrap.className = 'upload-row';

          var fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept =
            kind === 'video' ? 'video/*' : kind === 'image' ? 'image/*' : 'audio/*';

          var status = document.createElement('span');
          status.className = 'upload-status';

          fileInput.onchange = function () {
            var file = fileInput.files[0];
            if (!file) return;
            status.textContent = 'uploaden…';
            status.className = 'upload-status';
            fetch(
              '/api/upload?kind=' + kind + '&name=' + encodeURIComponent(file.name),
              {method: 'POST', body: file},
            )
              .then(function (r) {
                return r.json().then(function (data) {
                  return {ok: r.ok, data: data};
                });
              })
              .then(function (res) {
                if (res.data.ok) {
                  status.textContent =
                    '✓ ' +
                    res.data.path +
                    (res.data.deduped ? ' (al aanwezig)' : '') +
                    (res.data.normalized ? ' (rotatie/codec gefixt)' : '');
                  status.className = 'upload-status ok';
                  onUploaded(res.data.path);
                } else {
                  status.textContent = res.data.error || 'upload mislukt';
                  status.className = 'upload-status err';
                }
              })
              .catch(function (e) {
                status.textContent = 'upload mislukt: ' + e.message;
                status.className = 'upload-status err';
              })
              .finally(function () {
                fileInput.value = '';
              });
          };

          wrap.appendChild(fileInput);
          wrap.appendChild(status);
          return wrap;
        }

        function field(labelText, input, hint) {
          var wrap = document.createDocumentFragment();
          var label = document.createElement('label');
          label.textContent = labelText;
          wrap.appendChild(label);
          wrap.appendChild(input);
          if (hint) wrap.appendChild(hintEl(hint));
          return wrap;
        }

        function hintEl(text) {
          var h = document.createElement('div');
          h.className = 'hint';
          h.textContent = text;
          return h;
        }

        function heading(parent, title, intro) {
          var h1 = document.createElement('h1');
          h1.textContent = title;
          parent.appendChild(h1);
          if (intro) {
            var p = document.createElement('div');
            p.className = 'intro';
            p.textContent = intro;
            parent.appendChild(p);
          }
        }

        function smallButton(text, title, onClick) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'small-btn';
          btn.textContent = text;
          btn.title = title;
          btn.onclick = onClick;
          return btn;
        }

        // Bestand kiezen of uploaden; na upload de bestandslijst verversen.
        function fileField(parent, labelText, kind, obj, key, hint, onChange) {
          parent.appendChild(
            field(
              labelText,
              assetPicker(kind, obj[key], function (v) {
                obj[key] = v;
                onChange();
              }),
              hint,
            ),
          );
          parent.appendChild(
            uploadRow(kind, function (path) {
              obj[key] = path;
              loadAssets().then(function () {
                renderAll();
                onChange();
              });
            }),
          );
        }

        function toHex6(color) {
          var m = /^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.exec(color || '');
          if (m) return '#' + m[1] + m[1] + m[2] + m[2] + m[3] + m[3];
          return /^#[0-9a-f]{6}$/i.test(color || '') ? color : null;
        }

        // Kleurkiezer + hex-veld, blijven gelijk.
        function colorField(parent, labelText, obj, key, onChange) {
          var row = document.createElement('div');
          row.className = 'row';
          var pick = document.createElement('input');
          pick.type = 'color';
          var text = document.createElement('input');
          text.placeholder = DEFAULT_COLOR;
          text.value = obj[key] || '';
          pick.value = toHex6(obj[key]) || DEFAULT_COLOR;
          pick.oninput = function () {
            text.value = pick.value;
            obj[key] = pick.value;
            onChange();
          };
          text.oninput = function () {
            var v = text.value.trim();
            obj[key] = v || undefined;
            if (toHex6(v)) pick.value = toHex6(v);
            if (!v || toHex6(v)) onChange();
          };
          row.appendChild(pick);
          row.appendChild(text);
          parent.appendChild(field(labelText, row, 'Leeg = geel (' + DEFAULT_COLOR + ').'));
        }

        function textField(parent, labelText, obj, key, placeholder, multiline, onChange) {
          var input = document.createElement(multiline ? 'textarea' : 'input');
          input.value = obj[key] || '';
          input.placeholder = placeholder;
          if (!multiline) input.className = 'plain';
          input.oninput = function () {
            obj[key] = input.value || undefined;
            onChange();
          };
          parent.appendChild(
            field(
              labelText,
              input,
              'Leeg = "' + placeholder + '".' + (multiline ? ' Enter = nieuwe regel.' : ''),
            ),
          );
        }

        function barcodeField(parent, labelText, value, self, onChange, hint) {
          var row = document.createElement('div');
          row.className = 'row';
          var input = document.createElement('input');
          input.value = value || '';
          input.placeholder = '8712345670012';
          input.oninput = function () {
            onChange(input.value.trim() || null);
          };
          row.appendChild(input);
          row.appendChild(
            smallButton('genereer', 'willekeurige unieke barcode invullen', function () {
              input.value = randomBarcode(self);
              onChange(input.value);
            }),
          );
          parent.appendChild(field(labelText, row, hint));
        }

        // ---- rendering: forms ----

        function renderSplashForm() {
          var splash = manifest.splash;
          heading(
            formEl,
            'Splash-scherm',
            'Staat altijd vóór de eerste stop. De bezoeker swipet het witte blok naar ' +
              'rechts om te starten. De reset-barcode en terugzetten in de cradle brengen ' +
              'een scanner vanaf elk moment hier terug en wissen alle voortgang.',
          );
          fileField(
            formEl,
            'achtergrond (afbeelding)',
            'image',
            splash,
            'image',
            'Vult het scherm boven de slider.',
            syncPreview,
          );
          colorField(formEl, 'slider-kleur', splash, 'sliderColor', syncPreview);
          textField(formEl, 'slider-tekst', splash, 'sliderText', 'Swipe to start', false, syncPreview);
          barcodeField(
            formEl,
            'reset-barcode (verplicht)',
            manifest.resetScan,
            SPLASH,
            function (v) {
              manifest.resetScan = v;
              pushManifest();
            },
            'Werkt altijd: terug naar dit scherm, alle voortgang weg. ' +
              'Printbaar via "Barcodes (PDF)". Mag niet gelijk zijn aan een product-barcode.',
          );
        }

        function renderInstructionForm() {
          var instr = manifest.instruction;
          heading(
            formEl,
            'Luisterinstructie',
            'Donkere laag met tekst over het beeld. Verschijnt direct na het swipen ' +
              '(daaronder komt de eerste hint), en opnieuw na elke juiste scan vóór een ' +
              'audiotour. Timing testen: klik Splash en swipe in de preview.',
          );
          textField(formEl, 'tekst', instr, 'text', DEFAULT_INSTRUCTION_TEXT, true, syncPreview);

          var secInput = document.createElement('input');
          secInput.type = 'number';
          secInput.min = '0';
          secInput.max = '60';
          secInput.step = '0.5';
          secInput.placeholder = String(DEFAULT_INSTRUCTION_SECONDS);
          secInput.value = typeof instr.seconds === 'number' ? String(instr.seconds) : '';
          secInput.oninput = function () {
            var v = secInput.value.trim();
            instr.seconds = v === '' ? undefined : Number(v);
            pushManifest();
          };
          formEl.appendChild(
            field(
              'duur (seconden)',
              secInput,
              'Hoe lang de melding helemaal in beeld staat, plus een korte fade in en uit. ' +
                'Leeg = ' + DEFAULT_INSTRUCTION_SECONDS + '. 0 = nooit, meteen door.',
            ),
          );
        }

        function renderIntroForm() {
          heading(
            formEl,
            'Intro-audio',
            'Audiofragment na de splash, vóór de speurtocht. Eerst de luisterinstructie, ' +
              'dan speelt de intro op het audiotour-scherm. Klaar = hint van stop 1. ' +
              'Scans doen niets tot hij klaar is (reset wel). Timing testen: klik Splash ' +
              'en swipe in de preview.',
          );
          fileField(
            formEl,
            'bestand (audio)',
            'audio',
            manifest.intro,
            'src',
            'Leeg = geen intro, na de luisterinstructie meteen de hint van stop 1.',
            function () {
              renderSceneList();
              syncPreview();
            },
          );
          var play = smallButton('speel', 'speel de intro in de preview', syncPreview);
          formEl.appendChild(play);
        }

        function renderAudiotourForm() {
          heading(
            formEl,
            'Audiotour-scherm',
            'Achtergrond van elke audiotour-beloning, met 10 sec terug, pauze/play en ' +
              'volume erover. Geel vlak = voortgang. De preview toont het scherm zonder audio; ' +
              'een echte audiotour speel je bij een stop.',
          );
          fileField(
            formEl,
            'achtergrond (afbeelding)',
            'image',
            manifest.audiotour,
            'image',
            'Eén voor alle audiotours. Visual komt van de vormgever. Leeg = groen.',
            syncPreview,
          );
        }

        function renderEndForm() {
          var end = manifest.end;
          heading(
            formEl,
            'Eindscherm',
            'Na de beloning van de laatste stop. Blijft staan tot de reset-barcode ' +
              'gescand wordt of de scanner terug in de cradle gaat.',
          );
          fileField(
            formEl,
            'afbeelding',
            'image',
            end,
            'image',
            'Vult het scherm boven de balk. Leeg = groen met "the end".',
            syncPreview,
          );
          colorField(formEl, 'balk-kleur', end, 'barColor', syncPreview);
          textField(formEl, 'balk-tekst', end, 'barText', DEFAULT_END_TEXT, true, syncPreview);
        }

        // Hint of beloning: type kiezen, dan het bestand.
        function renderPart(stop, key, title, types, help, playLabel) {
          var part = stop[key];
          var box = document.createElement('div');
          box.className = 'part' + (previewPart === key ? ' previewing' : '');

          var head = document.createElement('div');
          head.className = 'part-head';
          var h2 = document.createElement('h2');
          h2.textContent = title;
          head.appendChild(h2);
          head.appendChild(
            smallButton(playLabel, 'laat dit zien in de preview', function () {
              previewPart = key;
              renderForm();
              syncPreview();
            }),
          );
          box.appendChild(head);

          var radios = document.createElement('div');
          radios.className = 'radio-row';
          types.forEach(function (t) {
            var lbl = document.createElement('label');
            var r = document.createElement('input');
            r.type = 'radio';
            r.name = key + '-type';
            r.checked = part.type === t[0];
            r.onchange = function () {
              // afbeelding <-> puzzel houdt het bestand, verder past het niet
              if (KIND[part.type] !== KIND[t[0]]) part.src = undefined;
              part.type = t[0];
              renderAll();
              if (previewPart === key) syncPreview();
            };
            lbl.appendChild(r);
            lbl.appendChild(document.createTextNode(t[1]));
            radios.appendChild(lbl);
          });
          box.appendChild(field('type', radios));

          fileField(box, 'bestand', KIND[part.type], part, 'src', help[part.type], function () {
            renderSceneList();
            if (previewPart === key) syncPreview();
          });
          formEl.appendChild(box);
        }

        function renderStopForm(stop) {
          heading(
            formEl,
            'Stop ' + (activeIndex + 1) + ' van ' + manifest.stops.length,
            'Hint in beeld → bezoeker scant dit product → beloning. Daarna de hint van ' +
              'de volgende stop, na de laatste het eindscherm.',
          );
          if (!stop.hint || typeof stop.hint !== 'object') stop.hint = {type: 'image'};
          if (!stop.reward || typeof stop.reward !== 'object') stop.reward = {type: 'audio'};

          var idInput = document.createElement('input');
          idInput.value = stop.id || '';
          idInput.oninput = function () {
            stop.id = idInput.value;
            renderSceneList();
            pushManifest();
          };
          formEl.appendChild(field('naam', idInput, 'Bv. het product. Staat op de barcode-kaart.'));

          barcodeField(
            formEl,
            'product-barcode',
            stop.scan,
            stop,
            function (v) {
              stop.scan = v;
              renderSceneList();
              pushManifest();
            },
            'Alleen deze code gaat door naar de beloning, andere geven "verkeerd product". ' +
              '8-14 cijfers, uniek per stop.',
          );

          renderPart(
            stop,
            'hint',
            'Hint',
            HINT_TYPES,
            {
              image: 'Staat stil in beeld tot de juiste scan.',
              puzzle:
                '3x3 puzzel van deze foto. Stukjes komen in willekeurige volgorde uit de balk ' +
                'onderin en klikken alleen op hun eigen plek vast. Doorscannen kan altijd.',
              video: 'Speelt zonder geluid, in een lus, tot de juiste scan.',
            },
            'toon',
          );
          renderPart(
            stop,
            'reward',
            'Beloning',
            REWARD_TYPES,
            {
              audio:
                'Eerst de luisterinstructie, dan het audiotour-scherm. Klaar = volgende stop. ' +
                'Scans doen niets tot hij klaar is (reset wel).',
              video: 'Speelt met geluid, één keer. Klaar = volgende stop.',
            },
            'speel',
          );

          var del = document.createElement('button');
          del.id = 'delete-scene';
          del.textContent = 'Stop verwijderen';
          del.onclick = function () {
            manifest.stops.splice(activeIndex, 1);
            select(manifest.stops.length ? Math.min(activeIndex, manifest.stops.length - 1) : END);
          };
          formEl.appendChild(del);
        }

        function renderForm() {
          formEl.innerHTML = '';
          if (activeIndex === SPLASH) return renderSplashForm();
          if (activeIndex === INSTRUCTION) return renderInstructionForm();
          if (activeIndex === INTRO) return renderIntroForm();
          if (activeIndex === AUDIOTOUR) return renderAudiotourForm();
          if (activeIndex === END) return renderEndForm();
          var stop = manifest.stops[activeIndex];
          if (!stop) {
            formEl.innerHTML = '<div id="empty-state">niets geselecteerd</div>';
            return;
          }
          renderStopForm(stop);
        }

        function renderAll() {
          renderSceneList();
          renderForm();
        }

        document.getElementById('barcodes').onclick = function () {
          window.open('barcodes.html', '_blank');
        };
        document.getElementById('library').onclick = function () {
          window.open('library.html', '_blank');
        };

        // ---- save ----

        document.getElementById('save').onclick = function () {
          manifest.version = versionEl.value || '0.3.0';
          errorsEl.classList.remove('show');
          setStatus('opslaan…');
          fetch('/api/manifest', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(manifest),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return {ok: r.ok, data: data};
              });
            })
            .then(function (res) {
              if (res.data.ok) {
                setStatus('opgeslagen ✓ (' + new Date().toLocaleTimeString() + ')');
                reloadFrame();
              } else {
                setStatus((res.data.errors || []).length + ' fout(en) — niet opgeslagen', true);
                errorsEl.textContent = (res.data.errors || []).join('\n');
                errorsEl.classList.add('show');
              }
            })
            .catch(function (e) {
              setStatus('opslaan mislukt: ' + e.message, true);
            });
        };

        // ---- preview scan simulator ----

        function packWindow(fn) {
          var win = frame.contentWindow;
          if (!win || typeof win[fn] !== 'function') {
            log('preview nog niet geladen (of ' + fn + ' ontbreekt)');
            return null;
          }
          return win;
        }

        document.getElementById('scan').onclick = function () {
          var code = document.getElementById('code').value.trim();
          if (!code) return;
          var win = packWindow('onNativeScan');
          if (!win) return;
          win.onNativeScan(code);
          log('scan verstuurd: ' + code);
        };
        document.getElementById('code').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') document.getElementById('scan').click();
        });
        // Zoals App.tsx: in de cradle = terug naar splash, en de swipe vraagt
        // dan om de cradle te openen (zie pack/runtime.js). Zonder App.tsx
        // opent er niets; na 15 s zonder "uit cradle" gaat de preview terug
        // naar splash, net als op het device.
        var inCradle = false;
        var dockBtn = document.getElementById('dock');

        function sendDock() {
          var win = packWindow('onNativeDock');
          if (win) win.onNativeDock(inCradle);
        }

        dockBtn.onclick = function () {
          inCradle = !inCradle;
          dockBtn.textContent = inCradle ? 'Uit cradle' : 'In cradle';
          dockBtn.className = inCradle ? 'on' : '';
          sendDock();
          log(inCradle ? 'scanner in cradle gezet' : 'scanner uit cradle gehaald');
        };
        document.getElementById('reload').onclick = function () {
          reloadFrame();
          log('preview herladen');
        };

        // ---- devices / adb push ----

        var deployLogEl = document.getElementById('deploy-log');
        var deviceSummaryEl = document.getElementById('device-summary');

        function showDeployLog(text) {
          deployLogEl.textContent = text;
          deployLogEl.classList.add('show');
        }

        function refreshDevices() {
          var btn = document.getElementById('refresh-devices');
          btn.disabled = true;
          deviceSummaryEl.textContent = 'devices ophalen…';
          return fetch('/api/devices')
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              showDeployLog(data.output || '(geen output)');
              var lines = (data.output || '').split('\n').filter(function (l) {
                return l.trim() && !/^SERIAL|^devices\b/.test(l);
              });
              deviceSummaryEl.textContent = lines.length + ' device(s) gevonden';
            })
            .catch(function (e) {
              deviceSummaryEl.textContent = 'devices ophalen mislukt: ' + e.message;
            })
            .finally(function () {
              btn.disabled = false;
            });
        }
        document.getElementById('refresh-devices').onclick = refreshDevices;

        document.getElementById('deploy').onclick = function () {
          var btn = this;
          btn.disabled = true;
          btn.textContent = 'bezig…';
          showDeployLog('push gestart…');
          fetch('/api/deploy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              restart: document.getElementById('restart-app').checked,
            }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              showDeployLog(data.output || '(geen output)');
            })
            .catch(function (e) {
              showDeployLog('push mislukt: ' + e.message);
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = 'Push naar scanners';
            });
        };

        refreshDevices();
        loadAssets().then(loadManifest);
      })();
    </script>
  </body>
</html>
