<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>zelfscanner — barcodes</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }
      #bar {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: #1c1c1c;
        border-bottom: 1px solid #2a2a2a;
        z-index: 1;
      }
      #bar h1 {
        font-size: 14px;
        margin: 0;
        flex: 1;
        color: #999;
        font-weight: normal;
      }
      #bar button {
        padding: 8px 16px;
        font-size: 13px;
        background: #2a6;
        color: #fff;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      #bar button:hover {
        background: #194;
      }
      #status {
        font-size: 12px;
        color: #f77;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        padding: 20px;
      }
      .card {
        background: #fff;
        color: #111;
        border-radius: 6px;
        padding: 16px;
        text-align: center;
        break-inside: avoid;
      }
      .card .scene-id {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .card .scene-meta {
        font-size: 10px;
        color: #777;
        margin-bottom: 10px;
      }
      .card svg {
        max-width: 100%;
        height: auto;
      }
      .card .code {
        margin-top: 8px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.05em;
      }
      .card.reset {
        outline: 4px solid #d22;
        outline-offset: -4px;
      }
      .card.reset .scene-id {
        color: #d22;
        letter-spacing: 0.08em;
      }
      #empty {
        padding: 40px 20px;
        color: #999;
        font-size: 13px;
      }

      @media print {
        body {
          background: #fff;
          color: #111;
        }
        #bar {
          display: none;
        }
        #grid {
          padding: 0;
        }
        .card {
          box-shadow: none;
          border: 1px solid #ccc;
        }
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <h1>Barcodes uit pack/manifest.json — Code 128, scanbaar met de Zebra-scanners</h1>
      <div id="status"></div>
      <button id="print">Print / opslaan als PDF</button>
    </div>
    <div id="grid"></div>

    <script>
      (function () {
        // ---- Code 128 (subset B) encoder ------------------------------
        // Width table: 107 entries (values 0-106), each 6 digits = the
        // widths of bar,space,bar,space,bar,space in modules (1-4 wide).
        // Source: the standard Code 128 symbol table (ISO/IEC 15417),
        // cross-checked value-by-value against the invariants every row
        // must satisfy (all 6 widths sum to 11, bar-widths sum even,
        // space-widths sum odd, all 107 patterns unique) before use here
        // -- a wrong entry would print a barcode that fails to scan.
        var WIDTHS = [
          '212222', '222122', '222221', '121223', '121322', '131222',
          '122213', '122312', '132212', '221213', '221312', '231212',
          '112232', '122132', '122231', '113222', '123122', '123221',
          '223211', '221132', '221231', '213212', '223112', '312131',
          '311222', '321122', '321221', '312212', '322112', '322211',
          '212123', '212321', '232121', '111323', '131123', '131321',
          '112313', '132113', '132311', '211313', '231113', '231311',
          '112133', '112331', '132131', '113123', '113321', '133121',
          '313121', '211331', '231131', '213113', '213311', '213131',
          '311123', '311321', '331121', '312113', '312311', '332111',
          '314111', '221411', '431111', '111224', '111422', '121124',
          '121421', '141122', '141221', '112214', '112412', '122114',
          '122411', '142112', '142211', '241211', '221114', '413111',
          '241112', '134111', '111242', '121142', '121241', '114212',
          '124112', '124211', '411212', '421112', '421211', '212141',
          '214121', '412121', '111143', '111341', '131141', '114113',
          '114311', '411113', '411311', '113141', '114131', '311141',
          '411131', '211412', '211214', '211232', '233111',
        ];
        var START_B = 104;
        var STOP = 106;

        function code128bValue(ch) {
          var code = ch.charCodeAt(0);
          if (code < 32 || code > 126) {
            throw new Error('teken niet ondersteund in Code128B: "' + ch + '"');
          }
          return code - 32;
        }

        function encode128b(data) {
          var values = [START_B];
          for (var i = 0; i < data.length; i++) values.push(code128bValue(data[i]));
          var checksum = values[0];
          for (var i = 1; i < values.length; i++) checksum += values[i] * i;
          checksum = checksum % 103;
          values.push(checksum);
          values.push(STOP);

          var runs = [];
          values.forEach(function (v) {
            WIDTHS[v].split('').forEach(function (d) {
              runs.push(Number(d));
            });
          });
          runs.push(2); // mandatory final bar after STOP (13-module stop = 11 + this)
          return runs;
        }

        function barcodeSVG(data, opts) {
          opts = opts || {};
          var moduleWidth = opts.moduleWidth || 2;
          var height = opts.height || 60;
          var quiet = opts.quiet != null ? opts.quiet : 10;

          var runs = encode128b(data);
          var totalModules = runs.reduce(function (a, b) {
            return a + b;
          }, 0);
          var width = (totalModules + quiet * 2) * moduleWidth;

          var x = quiet * moduleWidth;
          var isBar = true;
          var rects = '';
          runs.forEach(function (w) {
            var rw = w * moduleWidth;
            if (isBar) {
              rects +=
                '<rect x="' + x + '" y="0" width="' + rw + '" height="' + height + '"/>';
            }
            x += rw;
            isBar = !isBar;
          });

          return (
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
            width +
            ' ' +
            height +
            '" width="' +
            width +
            '" height="' +
            height +
            '">' +
            '<rect x="0" y="0" width="' + width + '" height="' + height + '" fill="#fff"/>' +
            '<g fill="#000">' + rects + '</g>' +
            '</svg>'
          );
        }

        // ---- page ------------------------------------------------------

        var gridEl = document.getElementById('grid');
        var statusEl = document.getElementById('status');

        fetch('/api/manifest')
          .then(function (r) {
            return r.json();
          })
          .then(function (manifest) {
            var NAMES = {image: 'afbeelding', puzzle: 'puzzel', video: 'video', audio: 'audiotour'};
            var cards = (manifest.stops || [])
              .filter(function (s) {
                return !!s.scan;
              })
              .map(function (s, i) {
                var hint = s.hint && NAMES[s.hint.type];
                var reward = s.reward && NAMES[s.reward.type];
                return {
                  id: i + 1 + '. ' + s.id,
                  code: s.scan,
                  meta: (hint || '?') + ' → ' + (reward || '?'),
                };
              });
            // reset-code vooraan, als eigen kaart
            if (manifest.resetScan) {
              cards.unshift({
                id: 'RESET',
                code: manifest.resetScan,
                meta: 'terug naar splash, voortgang weg',
                reset: true,
              });
            }
            if (cards.length === 0) {
              gridEl.innerHTML =
                '<div id="empty">geen stops met een barcode in pack/manifest.json</div>';
              return;
            }
            cards.forEach(function (item) {
              var card = document.createElement('div');
              card.className = 'card' + (item.reset ? ' reset' : '');

              var id = document.createElement('div');
              id.className = 'scene-id';
              id.textContent = item.id;
              card.appendChild(id);

              var meta = document.createElement('div');
              meta.className = 'scene-meta';
              meta.textContent = item.meta;
              card.appendChild(meta);

              try {
                var svg = barcodeSVG(item.code);
                var svgWrap = document.createElement('div');
                svgWrap.innerHTML = svg;
                card.appendChild(svgWrap.firstChild);
              } catch (e) {
                var err = document.createElement('div');
                err.textContent = 'kon barcode niet renderen: ' + e.message;
                err.style.color = '#c00';
                card.appendChild(err);
              }

              var code = document.createElement('div');
              code.className = 'code';
              code.textContent = item.code;
              card.appendChild(code);

              gridEl.appendChild(card);
            });
          })
          .catch(function (e) {
            statusEl.textContent = 'manifest laden mislukt: ' + e.message;
          });

        document.getElementById('print').onclick = function () {
          window.print();
        };
      })();
    </script>
  </body>
</html>
