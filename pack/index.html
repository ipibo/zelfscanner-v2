<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  video, img#photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  img#photo { display: none; }
  /* top/left/right/bottom i.p.v. inset: inset bestaat pas sinds Chromium 87.
     z-index boven puzzel (2), verteller (5), html-pagina (6), audiotour (20),
     eindscherm (30), hulp-knop (35), overlay (40) en hulp-kaart (45),
     anders zie je de melding daar niet. */
  #error {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(200, 0, 0, 0.85); color: #fff; font: bold 8vw sans-serif; text-align: center;
    padding: 0 8vw; box-sizing: border-box; white-space: pre-line;
  }
  #error.show { display: flex; }
  #debug {
    position: absolute; bottom: 8px; left: 8px; color: #7CFC00; font: 12px monospace; opacity: 0.85;
  }
</style>
</head>
<body>
  <video id="player" playsinline></video>
  <img id="photo" alt="">
  <div id="error"></div>
  <div id="debug">loading pack…</div>
  <script>
    // <script src="runtime.js"> does NOT load on this WebView (Android 5.1 /
    // Chromium 46: local <script src> sub-resource loads are blocked, even
    // with allowFileAccess on). XHR to local files DOES work here, so we
    // fetch the runtime's source as text and eval it instead. Confirmed by
    // hand on-device 2026-08-06 — don't revert to <script src>.
    (function () {
      var debugEl = document.getElementById('debug');

      function loadLocal(path) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', path, false);
        // file:// responses carry no Content-Type, so force UTF-8 rather than
        // let the WebView guess -- defensive, for whenever this source has
        // non-ASCII text again. (The actual eval SyntaxError hit on-device
        // 2026-08-06 turned out to be unrelated: a trailing comma in a
        // function call in runtime.js, ES2017 syntax this old V8 rejects.)
        xhr.overrideMimeType('text/plain; charset=utf-8');
        xhr.send();
        if (!xhr.responseText) {
          debugEl.textContent = path + ' leeg of niet gevonden (status ' + xhr.status + ')';
          return false;
        }
        (0, eval)(xhr.responseText);
        return true;
      }

      try {
        // modules eerst, runtime.js als laatste: die gebruikt ze allemaal
        // (ZSFx, ZSPuzzle, ZSSplash, ZSOverlay, ZSAudiotour, ZSEnd,
        // ZSNarrator, ZSPage, ZSHelp). fx.js vóór narrator.js en page.js.
        var files = [
          'fx.js', 'puzzle.js', 'splash.js', 'overlay.js', 'audiotour.js', 'end.js',
          'narrator.js', 'page.js', 'help.js', 'runtime.js'
        ];
        for (var i = 0; i < files.length && loadLocal(files[i]); i++) {}
      } catch (e) {
        debugEl.textContent = 'pack laden MISLUKT: ' + e.message;
      }
    })();
  </script>
</body>
</html>
